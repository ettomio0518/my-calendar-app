<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>幸福ワードランキング</title>
    <style>
        :root {
            --bg-color: #fdfbf7;
            --card-bg: #ffffff;
            --text-color: #333333;
            --primary-color: #ffb703;
            --primary-hover: #fb8500;
            --accent-color: #219ebc;
            --border-color: #e0e0e0;
            --shadow: 0 4px 12px rgba(0,0,0,0.05);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 600px;
        }

        header {
            text-align: center;
            margin-bottom: 20px;
        }

        h1 {
            font-size: 1.4rem;
            color: #d4a373;
            margin-bottom: 4px;
        }

        .catchphrase {
            font-size: 0.95rem;
            color: #666;
            font-weight: bold;
        }

        .card {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 16px;
            box-shadow: var(--shadow);
            margin-bottom: 16px;
        }

        .form-group {
            margin-bottom: 12px;
        }

        label {
            display: block;
            font-size: 0.85rem;
            margin-bottom: 4px;
            font-weight: bold;
        }

        input[type="text"], select {
            width: 100%;
            padding: 10px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 1rem;
            box-sizing: border-box;
        }

        .rating-select {
            display: flex;
            gap: 8px;
        }

        .rating-select button {
            flex: 1;
            padding: 8px;
            border: 1px solid var(--border-color);
            background: #fff;
            border-radius: 6px;
            font-size: 1.1rem;
            cursor: pointer;
            transition: 0.2s;
        }

        .rating-select button.active {
            background: var(--primary-color);
            border-color: var(--primary-hover);
            color: white;
        }

        .btn-submit {
            width: 100%;
            padding: 12px;
            background: var(--primary-hover);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 2px 6px rgba(251, 133, 0, 0.3);
        }

        .btn-submit:active {
            transform: scale(0.98);
        }

        .message-box {
            background: #fff3cd;
            border-left: 4px solid var(--primary-color);
            padding: 12px;
            border-radius: 4px;
            font-size: 0.9rem;
            margin-bottom: 16px;
            line-height: 1.5;
        }

        .list-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
            font-size: 0.9rem;
            font-weight: bold;
        }

        .word-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .word-item {
            background: var(--card-bg);
            padding: 12px;
            border-radius: 8px;
            box-shadow: var(--shadow);
            border-left: 4px solid var(--accent-color);
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .word-main {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        .word-text {
            font-size: 1.05rem;
            font-weight: bold;
            word-break: break-all;
        }

        .word-stars {
            color: #ffb703;
            font-size: 0.9rem;
            white-space: nowrap;
        }

        .word-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.75rem;
            color: #888;
        }

        .word-link a {
            color: var(--accent-color);
            text-decoration: underline;
        }

        .empty-state {
            text-align: center;
            color: #999;
            padding: 20px;
            font-size: 0.9rem;
        }
        
		/* ===============================
		   フッター
		   =============================== */
		footer {
		    text-align: center;
		    color: #0080ff;
		    padding: 10px;
		    font-size: 14px;
		}

	    /* 戻るボタン（右上）を統一デザインに変更 */
	    .top-right-button {
	      /*position: absolute; */
	      position: fixed;
	      top: 2px;
	      right: 10px;
	      background-color: #007bff;
	      color: white;
	      border: none;
	      border-radius: 20px;
	      padding: 6px 12px;
	      font-size: 14px;
	      cursor: pointer;
	    }
	    .top-right-button:hover {
	      background-color: #0056b3;
	    }
    		        
    </style>
</head>
<body>

<div class="container">
    <header>
        <button class="top-right-button" onclick="location.href='index.html'">戻る</button>
        
        <h1>幸福ワードランキング</h1>
        <div class="catchphrase">日常生活をポジティブ思考で行こう❗️<br>
         ポジティブ思考は絶対に必要❗️</div>
    </header>

    <div class="message-box" id="energyMessage">
        日々の生活の中で、前向きなワードを見つけたら登録してみましょう。<br>
        振り返ってみましょう。貴方はこのポジティブな言葉にいっぱいエネルギーを貰いましたよ。
    </div>

    <div class="card">
        <div class="form-group">
            <label>前向きワード・内容</label>
            <input type="text" id="wordInput" placeholder="例：今日も元気に過ごせた❗️">
        </div>
        <div class="form-group">
            <label>幸福度ランク</label>
            <div class="rating-select" id="ratingSelect">
                <button type="button" data-rating="1">★1</button>
                <button type="button" data-rating="2">★2</button>
                <button type="button" data-rating="3">★3</button>
                <button type="button" data-rating="4">★4</button>
                <button type="button" data-rating="5" class="active">★5</button>
            </div>
        </div>
        <div class="form-group">
            <label>参考URL（任意）</label>
            <input type="text" id="urlInput" placeholder="https://example.com">
        </div>
        <button class="btn-submit" id="addBtn">忽ち投入❗️ 登録する</button>
    </div>

    <div class="list-header">
        <span>登録ワード一覧（★ 昇順）</span>
        <span id="countLabel">0件</span>
    </div>

    <div class="word-list" id="wordList">
        <div class="empty-state">まだワードが登録されていません。</div>
    </div>
</div>

<script>
    let currentRating = 5;
    let words = JSON.parse(localStorage.getItem('happiness_words') || '[]');

    const ratingButtons = document.querySelectorAll('#ratingSelect button');
    ratingButtons.forEach(btn => {
        btn.addEventListener('click', () => {
            ratingButtons.forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            currentRating = parseInt(btn.dataset.rating);
        });
    });

    function linkify(text) {
        if (!text) return '';
        const urlPattern = /(https?:\/\/[^\s]+)/g;
        return text.replace(urlPattern, url => `<a href="${url}" target="_blank" rel="noopener noreferrer" onclick="openExternal(event, '${url}')">${url}</a>`);
    }

    function openExternal(e, url) {
        e.preventDefault();
        if (window.Android && typeof window.Android.openExternalBrowser === 'function') {
            window.Android.openExternalBrowser(url);
        } else {
            window.open(url, '_blank');
        }
    }

    function render() {
        const listContainer = document.getElementById('wordList');
        const countLabel = document.getElementById('countLabel');
        countLabel.textContent = words.length + '件';

        if (words.length === 0) {
            listContainer.innerHTML = '<div class="empty-state">まだワードが登録されていません。</div>';
            return;
        }

        const sortedWords = [...words].sort((a, b) => b.rating - a.rating);

        listContainer.innerHTML = '';
        sortedWords.forEach(item => {
            const div = document.createElement('div');
            div.className = 'word-item';

            const stars = '★'.repeat(item.rating) + '☆'.repeat(5 - item.rating);
            const formattedContent = linkify(item.content);
            const formattedUrl = item.url ? linkify(item.url) : '';

            div.innerHTML = `
                <div class="word-main">
                    <div class="word-text">${formattedContent}</div>
                    <div class="word-stars">${stars}</div>
                </div>
                ${item.url ? `<div class="word-link">🔗 ${formattedUrl}</div>` : ''}
                <div class="word-footer">
                    <span>${item.date}</span>
                </div>
            `;
            listContainer.appendChild(div);
        });
    }

    document.getElementById('addBtn').addEventListener('click', () => {
        const input = document.getElementById('wordInput');
        const urlInput = document.getElementById('urlInput');
        const content = input.value.trim();
        const url = urlInput.value.trim();

        if (!content) {
            alert('内容を入力してください。');
            return;
        }

        const now = new Date();
        const pad = n => String(n).padStart(2, '0');
        const formattedDate = `${now.getFullYear()}/${pad(now.getMonth()+1)}/${pad(now.getDate())} ${pad(now.getHours())}:${pad(now.getMinutes())}`;

        const newItem = {
            id: Date.now(),
            content: content,
            rating: currentRating,
            url: url,
            date: formattedDate
        };

        words.push(newItem);
        localStorage.setItem('happiness_words', JSON.stringify(words));

        input.value = '';
        urlInput.value = '';
        render();
    });

    render();
</script>

<footer>
    © 20260904 ettomio - 舞いカレンダー
</footer>

</body>
</html>
