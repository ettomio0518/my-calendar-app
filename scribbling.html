<body>

<header class="app-header">
  <h1>✏️ 走り書き scribbling <span id="lockMark"></span></h1>
  <button class="top-right-button">戻る</button>
</header>

<main>

  <div class="date-row">
    <button onclick="moveDate(-1)">◁</button>
    <button id="todayButton" onclick="setToday()">今日</button>
    <button onclick="moveDate(1)">▷</button>
    <input type="date" id="dateInput">
  </div>

	<div style="white-space: nowrap;">
	  <button id="hintToggle" onclick="toggleHint()">
	    <span class="hint-icon">?</span> 予定入力の仕方
	  </button>
	  <span style="color: blue; font-size: 14px; padding: 10px;"><strong>クリッカブルURL対応</strong></span>
	</div>
  
  <div id="hintBox" style="display: none; font-size: 0.9em; color: #974b00; background: #eee; padding: 6px; margin-top: 4px;">
    走り書きにふと予定を思いついたら、「13時〜15時 テスト」や「13時-15時 テスト」、「13時から15時 テスト」など、時間帯を含めて書いてみてください。<br>
    指でその部分をなぞると、予定として入力できます。<br>
    入力された予定は、今日のカードの時間割に反映されます。
  </div>

  <textarea id="memo" placeholder="アイデア・買い物メモなど自由に走り書き"></textarea>
  <div id="memoDisplay" class="memo-display"></div>
  
	<div id="linkList" style="margin-top: 10px; font-size: 0.9em; color: #004488;"></div>

  <div class="action-row">
  	<button class="button3" onclick="openQRReader()">QRコードリーダー</button>  
    <button class="button3" onclick="openOCRReader()">簡易版OCR</button>        
    <button class="save-button" onclick="saveMemo()">💾 保存</button>
    <button class="button2" onclick="deleteMemo()">破棄</button>
    <button class="button2" onclick="deleteOldMemos()">7日以上前を破棄</button>
    <button id="button4" class="button4" onclick="handleSelection()" disabled>📌 選択を予定に追加</button>
  </div>

  <p class="warn">
    雑記ですので逐一データは破棄してください。容量を圧迫してしまいます。
  </p>

  <div class="action-row">
    <button class="save-button" onclick="protectMemo()">🔒 破棄不可</button>
    <button class="button2" onclick="unprotectMemo()">🔓 解除</button>
    <button id="keyNButton">高機能検索</button>
    <button class="copy-button" onclick="copyAll()">全選択コピー</button>
  </div>

  <div class="calc-btn-wrapper">
  	<button id="gmailbutton" onclick="openGmailInbox()">📬 Gmail送受信</button>
    <button id="calc-btn" class="calc-btn">🧮 電卓</button>
  </div>

  <div id="calcModal" class="modal">
    <div class="modal-content">
      <span class="close" onclick="closeCalcModal()">&times;</span>
      <iframe src="calculatorapp.html?from=scribbling" class="calc-frame"></iframe>
    </div>
  </div>

	<button id="toggleHistoryBtn" onclick="toggleHistory()">📜 履歴表示</button>

	<div id="historyPanel" class="history-panel" style="display: none;">
	  <h3>📜 走り書き一覧</h3>
	  <div id="historyList"></div>
	</div>

</main>

<script>

	  // 2/22追加 2/23修正
	  /** * Gmailを開く前に確認ダイアログを表示する */
	  function openGmailInbox() {
	    const isGmailUser = confirm("Gmailをお使いですか?");
	    if (isGmailUser) {
	      window.open('https://mail.google.com/mail/u/0/#inbox', '_blank');
	    } else {
	      console.log("Gmailは開きませんでした。");
	    }
	  }

	function updateTodayButtonStyle() {
	  const todayButton = document.getElementById('todayButton');
	  const dateInput = document.getElementById('dateInput');

	  const now = new Date();
	  const todayStr = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')}`;

	  if (dateInput.value === todayStr) {
	    todayButton.classList.add('today-active');
	  } else {
	    todayButton.classList.remove('today-active');
	  }
	}

  function memoKey(date) {
    return 'scribbling_' + date.replace(/-/g, '');
  }

  function metaKey(date) {
    return 'scribbling_meta_' + date.replace(/-/g, '');
  }

  function isProtected(date) {
    const meta = JSON.parse(localStorage.getItem(metaKey(date)) || '{}');
    return meta.protected === true;
  }

  function updateLockMark() {
    const dateInput = document.getElementById('dateInput');
    const lockMark = document.getElementById('lockMark');
    lockMark.textContent = isProtected(dateInput.value) ? '🔒' : '';
  }


	function extractLinks(text) {
	  const urlPattern = /(https?:\/\/[^\s]+)/g;
	  const matches = text.match(urlPattern);
	  if (!matches) return '';

	  return matches.map(url => 
	    `<div><a href="#" onclick="window.open('${url}', '_blank', 'noopener'); return false;">${url}</a></div>`
	  ).join('');
	}

	function updateLinkList(text) {
	  const linkList = document.getElementById('linkList');
	  if (linkList) {
	    linkList.innerHTML = extractLinks(text);
	  }
	}

	function loadMemo() {
	  const dateInput = document.getElementById('dateInput');
	  const memo = document.getElementById('memo');
	  const key = memoKey(dateInput.value);
	  const saved = localStorage.getItem(key);
	  memo.value = saved || '';

	  // URLリンク一覧を更新
	  updateLinkList(memo.value);

	  const display = document.getElementById('memoDisplay');
	  if (display) {
	    // display.innerHTML = linkify(memo.value); // リンク化しない場合はコメントアウト
	  }
	}

	function setToday() {
	  const now = new Date();
	  const y = now.getFullYear();
	  const m = String(now.getMonth() + 1).padStart(2, '0');
	  const d = String(now.getDate()).padStart(2, '0');
	  document.getElementById('dateInput').value = `${y}-${m}-${d}`;
	  loadMemo();
	  updateLockMark();
	  updateTodayButtonStyle(); // ← 追加
	}

	function moveDate(diff) {
	  const dateInput = document.getElementById('dateInput');
	  const parts = dateInput.value.split('-');
	  const d = new Date(parts[0], parts[1] - 1, parts[2]);
	  d.setDate(d.getDate() + diff);
	  dateInput.value = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
	  loadMemo();
	  updateLockMark();
	  updateTodayButtonStyle();

	  // ボタンの強調表示
	  const leftBtn = document.querySelector('.date-row button:nth-child(1)');
	  const rightBtn = document.querySelector('.date-row button:nth-child(3)');
	  const targetBtn = diff < 0 ? leftBtn : rightBtn;

	  targetBtn.classList.add('active-direction');
	  setTimeout(() => targetBtn.classList.remove('active-direction'), 200); // 0.2秒後に戻す
	}

	function saveMemo() {
	  const dateInput = document.getElementById('dateInput');
	  const memo = document.getElementById('memo');
	  localStorage.setItem(memoKey(dateInput.value), memo.value);
	  alert('保存しました');

	  // URLリンク一覧を更新
	  updateLinkList(memo.value);
	}

  function deleteMemo() {
    const dateInput = document.getElementById('dateInput');
    if (isProtected(dateInput.value)) {
      alert('破棄不可に設定されています。');
      return;
    }
    localStorage.removeItem(memoKey(dateInput.value));
    localStorage.removeItem(metaKey(dateInput.value));
    loadMemo();
    alert('破棄しました');
  }

  function deleteOldMemos() {
    const now = new Date();
    let deleted = 0;
    let protectedCount = 0;

    for (let i = localStorage.length - 1; i >= 0; i--) {
      const key = localStorage.key(i);
      if (!key.startsWith('scribbling_') || key.startsWith('scribbling_meta_')) continue;

      const dateStr = key.replace('scribbling_', '');
      const y = dateStr.slice(0, 4);
      const m = dateStr.slice(4, 6);
      const d = dateStr.slice(6, 8);
      const memoDate = new Date(`${y}-${m}-${d}`);
      const diffDays = (now - memoDate) / (1000 * 60 * 60 * 24);

      if (diffDays >= 7) {
        const date = `${y}-${m}-${d}`;
        if (isProtected(date)) {
          protectedCount++;
        } else {
          localStorage.removeItem(key);
          localStorage.removeItem(metaKey(date));
          deleted++;
        }
      }
    }

    loadMemo();
    alert(`${deleted}件の走り書きを破棄しました。\n${protectedCount}件は破棄できません。`);
  }

  function protectMemo() {
    const dateInput = document.getElementById('dateInput');
    localStorage.setItem(metaKey(dateInput.value), JSON.stringify({ protected: true }));
    updateLockMark();
    alert('破棄不可に設定されました。');
  }

  function unprotectMemo() {
    const dateInput = document.getElementById('dateInput');
    localStorage.removeItem(metaKey(dateInput.value));
    updateLockMark();
    alert('破棄不可を解除しました。');
  }

  function copyAll() {
    const text = document.getElementById('memo').value;
    navigator.clipboard.writeText(text).then(() => {
      alert('コピーしました。メールアプリや外部アプリに貼り付けてご利用ください。');
    });
  }

	function toggleHint() {
	  const hint = document.getElementById("hintBox");
	  const button = document.getElementById("hintToggle");
	  const isVisible = hint.style.display === "block";

	  hint.style.display = isVisible ? "none" : "block";

	  if (isVisible) {
	    button.innerHTML = '<span class="hint-icon">?</span> 予定入力の仕方';
	  } else {
	    button.innerHTML = '✕ 説明を閉じる';
	  }
	}

  function checkSelection() {
    const textarea = document.getElementById("memo");
    const button4 = document.getElementById("button4");
    const selectedText = textarea.value.substring(textarea.selectionStart, textarea.selectionEnd).trim();

    const sep = '(?:-|−|–|—|〜|～|から)';
    const time = '(\\d{1,2})(?:[:：](\\d{1,2})|時(?:\\s*(\\d{1,2})分)?)?';
    const re = new RegExp(time + '\\s*' + sep + '\\s*' + time);

    button4.disabled = !(selectedText && re.test(selectedText));
  }

  function handleSelection() {
    const textarea = document.getElementById('memo');
    const selectedText = textarea.value.substring(textarea.selectionStart, textarea.selectionEnd).trim();
    const button4 = document.getElementById("button4");

    if (!selectedText) {
      alert("テキストを選択してください。");
      button4.disabled = true;
      return;
    }

    const sep = '(?:-|−|–|—|〜|～|から)';
    const time = '(\\d{1,2})(?:[:：](\\d{1,2})|時(?:\\s*(\\d{1,2})分)?)?';
    const re = new RegExp(time + '\\s*' + sep + '\\s*' + time);

    if (!re.test(selectedText)) {
      alert("時間帯が見つかりませんでした。");
      button4.disabled = true;
      return;
    }

    const confirmed = confirm("選択した内容を予定として追加しますか？");
    if (confirmed) {
      trySaveScheduleFromTextarea();
      if (typeof showTodaySchedule === "function") {
        showTodaySchedule();
      }
    }

    button4.disabled = true;
  }

  function trySaveScheduleFromTextarea() {
    const textarea = document.getElementById('memo');
    const selectedText = textarea.value.substring(textarea.selectionStart, textarea.selectionEnd).trim();

    if (!selectedText) {
      alert("テキストを選択してください。");
      return;
    }

    const sep = '(?:-|−|–|—|〜|～|から)';
    const time = '(\\d{1,2})(?:[:：](\\d{1,2})|時(?:\\s*(\\d{1,2})分)?)?';
    const re = new RegExp(time + '\\s*' + sep + '\\s*' + time);
    const match = selectedText.match(re);

    if (!match) {
      alert("時間帯が見つかりませんでした。");
      return;
    }

    const sh = parseInt(match[1], 10);
    const sm = match[2] ? parseInt(match[2], 10) : (match[3] ? parseInt(match[3], 10) : 0);
    const eh = parseInt(match[4], 10);
    const em = match[5] ? parseInt(match[5], 10) : (match[6] ? parseInt(match[6], 10) : 0);

    let title = selectedText.replace(re, '').trim() || '（無題の予定）';
    title = title.replace(/^(\s*[、,]+)/, '');

    const date = document.getElementById('dateInput').value;
    const ymd = date.replace(/-/g, '');
    const mmdd = `${date.slice(5, 7)}/${date.slice(8, 10)}`;
    const rand = Math.floor(Math.random() * 1000);
    const key = `ScheduledText${ymd}_${rand}`;
    const value = `${mmdd} ${sh}時${sm ? sm + '分' : ''}から${eh}時${em ? em + '分' : ''}、${title}`;

    localStorage.setItem(key, value);
    alert("予定として保存しました");
  }

	function toggleHistory() {
	  const panel = document.getElementById('historyPanel');
	  const button = document.getElementById('toggleHistoryBtn');

	  const isVisible = panel.style.display === 'block';
	  panel.style.display = isVisible ? 'none' : 'block';
	  button.textContent = isVisible ? '📜 履歴表示' : '✕ 履歴を閉じる';
	}

	function renderHistoryList() {
	  const historyList = document.getElementById('historyList');
	  historyList.innerHTML = '';

	  const entries = [];

	  for (let i = 0; i < localStorage.length; i++) {
	    const key = localStorage.key(i);
	    if (!key.startsWith('scribbling_') || key.startsWith('scribbling_meta_')) continue;

	    const dateStr = key.replace('scribbling_', '');
	    const y = dateStr.slice(0, 4);
	    const m = dateStr.slice(4, 6);
	    const d = dateStr.slice(6, 8);
	    const date = `${y}-${m}-${d}`;
	    const content = localStorage.getItem(key) || '';
	    const preview = content.split('\n')[0].slice(0, 20); // 先頭行の20文字まで

	    entries.push({ date, preview });
	  }

	  // 日付で降順ソート
	  entries.sort((a, b) => b.date.localeCompare(a.date));

	  for (const entry of entries) {
	    const div = document.createElement('div');
	    div.className = 'history-entry';

	    const text = document.createElement('span');
	    text.textContent = `${entry.date}：${entry.preview}`;

	    const btn = document.createElement('button');
	    btn.textContent = '表示';
	    btn.onclick = () => {
	      document.getElementById('dateInput').value = entry.date;
	      loadMemo();
	      updateLockMark();
	      updateTodayButtonStyle();
	      // 📜 上部へスクロール 
	      window.scrollTo({ top: 0, behavior: 'smooth' });
	    };

	    div.appendChild(text);
	    div.appendChild(btn);
	    historyList.appendChild(div);
	  }
	}

  // イベント登録
	document.addEventListener("DOMContentLoaded", () => {
	  const textarea = document.getElementById("memo");

	  textarea.addEventListener("mouseup", () => setTimeout(checkSelection, 150));
	  textarea.addEventListener("keyup", checkSelection);
	  textarea.addEventListener("touchend", () => setTimeout(checkSelection, 200));
	  textarea.addEventListener("selectionchange", checkSelection);

	  const dateInput = document.getElementById("dateInput");
	  dateInput.addEventListener("change", () => {
	    loadMemo();
	    updateLockMark();
	    updateTodayButtonStyle(); // ← 追加
	  });

	  // 戻るボタンの遷移先切り替え
	  const params = new URLSearchParams(location.search);
	  const from = params.get("from");
	  const backBtn = document.querySelector(".top-right-button");
	  if (from === "index") {
	    backBtn.onclick = () => location.href = "index.html";
	  } else {
	    backBtn.onclick = () => location.href = "today-card.html";
	  }

	  // 高機能検索ボタンの遷移先切り替え
	  const keyNButton = document.getElementById("keyNButton");
	  if (from === "today") {
	    keyNButton.onclick = () => location.href = "AdvancedSearch.html?from=scribbling&origin=today";
	  } else {
	    keyNButton.onclick = () => location.href = "AdvancedSearch.html?from=scribbling&origin=index";
	  }

	  // 電卓モーダル
	  document.getElementById("calc-btn").onclick = () => {
	    document.getElementById("calcModal").style.display = "block";
	  };
	  window.closeCalcModal = () => {
	    document.getElementById("calcModal").style.display = "none";
	  };

	  // 初期表示
	  setToday();
	  
		// 🔽 ここに追加！ 
		renderHistoryList();
	});

</script>

	    <button class="top-button" id="topBtn" onclick="scrollToTop()">Top</button>
		<button class="bottom-button" id="bottomBtn" onclick="scrollToBottom()">Bottom</button>

  <script>
	    // ==========================================================
	    // ★ スクロールボタン制御 (Top/Bottom)
	    // ==========================================================

	    function scrollToTop() {
	      window.scrollTo({ top: 0, behavior: 'smooth' });
	    }

	    function scrollToBottom() {
	      window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
	    }

	    function hideScrollButtons() {
	        document.getElementById("topBtn").style.display = "none";
	        document.getElementById("bottomBtn").style.display = "none";
	    }

		// ==========================================================
		// ★ スクロールボタン制御の修正版 (Top/Bottom 独立制御) 12/02
		// ==========================================================
		function showScrollButtonsIfPageLong() {
		    const topBtn = document.getElementById("topBtn");
		    const bottomBtn = document.getElementById("bottomBtn");
		    
		    const docHeight = document.body.scrollHeight;
		    const viewHeight = window.innerHeight;
		    const scrollY = window.scrollY;
		    
		    const scrollThreshold = 100; // ボタンが表示されるしきい値 (px)
		    
		    // ページがスクロール可能でなければ両方非表示
		    if (docHeight <= viewHeight + scrollThreshold) {
		        topBtn.style.display = "none";
		        bottomBtn.style.display = "none";
		        return;
		    }

		    // --- Topボタンの表示制御 ---
		    // 100px以上スクロールしたらTopボタンを表示
		    if (scrollY > scrollThreshold) {
		        topBtn.style.display = "block";
		    } else {
		        topBtn.style.display = "none";
		    }

			// --- Bottomボタンの表示制御 ---
			// 100px以上スクロール かつ 下端まで余裕がある場合のみ表示
			if (
			    scrollY > scrollThreshold &&
			    docHeight - viewHeight - scrollY > scrollThreshold
			) {
			    bottomBtn.style.display = "block";
			} else {
			    bottomBtn.style.display = "none";
			}
		}

	    // スクロール時のボタン表示制御
	    window.addEventListener("scroll", showScrollButtonsIfPageLong);
	    
	    // 初期ロード時にもボタン表示をチェック
	    window.addEventListener("load", showScrollButtonsIfPageLong);
	    
	    // 画面サイズ変更時にもチェック (スマホの向き変更など)
	    window.addEventListener("resize", showScrollButtonsIfPageLong);


	    // ==========================================================
	    // ★ 初期化
	    // ==========================================================
	    // 初期化処理はDOMContentLoadedが完了したタイミングで実行される
	    document.addEventListener('DOMContentLoaded', () => {
	        showScrollButtonsIfPageLong();
	    });
	    
  </script>
